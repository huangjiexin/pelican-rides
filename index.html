<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelican Rides · 鹈鹕骑行</title>
<meta name="description" content="A procedurally-built pelican riding a bicycle along an endless coastal road. Three.js, custom shaders, IK, verlet cloth, bloom, day/night cycle.">
<meta property="og:title" content="Pelican Rides · 鹈鹕骑行">
<meta property="og:description" content="鹈鹕骑自行车的实时 3D 场景：程序化建模、IK 蹬车、Verlet 围巾、自定义天空/海水 Shader、昼夜循环、Bloom 后处理。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
<style>
  :root { --fg:#f4f6f8; --dim:rgba(244,246,248,.62); --panel:rgba(8,14,24,.55); --accent:#ffb84d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b1520; color:var(--fg);
    font-family: ui-sans-serif, -apple-system, "PingFang SC", "Segoe UI", Roboto, "Noto Sans SC", sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }

  .hud { position:fixed; pointer-events:none; user-select:none; }
  #title { left:20px; top:18px; }
  #title h1 { margin:0; font-size:22px; letter-spacing:.06em; font-weight:700; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  #title h1 span { color:var(--accent); }
  #title p { margin:4px 0 0; font-size:12px; color:var(--dim); }

  #stats { right:20px; top:18px; text-align:right; font-variant-numeric:tabular-nums; }
  #stats .big { font-size:34px; font-weight:800; line-height:1; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  #stats .big small { font-size:12px; font-weight:500; color:var(--dim); margin-left:4px; }
  #stats .row { font-size:12px; color:var(--dim); margin-top:6px; display:flex; gap:14px; justify-content:flex-end; }
  #stats .row b { color:var(--fg); font-weight:600; }

  #help { left:20px; bottom:18px; font-size:12px; color:var(--dim); line-height:1.7; background:var(--panel);
    padding:10px 14px; border-radius:12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,.06); }
  #help kbd { display:inline-block; min-width:20px; text-align:center; padding:1px 6px; border-radius:5px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15); color:var(--fg); font-family: ui-monospace, Menlo, monospace; font-size:11px; margin-right:4px; }

  #toast { left:50%; top:22px; transform:translateX(-50%); font-size:13px; padding:8px 14px; border-radius:999px;
    background:var(--panel); border:1px solid rgba(255,255,255,.08); opacity:0; transition:opacity .25s; backdrop-filter: blur(10px); }
  #toast.show { opacity:1; }

  .lil-gui { --background-color: rgba(8,14,24,.72) !important; --widget-color: rgba(255,255,255,.08) !important;
    --hover-color: rgba(255,255,255,.14) !important; --focus-color: rgba(255,184,77,.35) !important; --number-color: #ffb84d !important;
    --string-color: #8fd3ff !important; --title-background-color: rgba(255,255,255,.06) !important; backdrop-filter: blur(10px); border-radius:12px; overflow:hidden; }
  .lil-gui.root { top: 96px !important; right: 20px !important; }

  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at 50% 40%, #16324a 0%, #0b1520 70%); z-index:10; transition:opacity .7s; }
  #loading.gone { opacity:0; pointer-events:none; }
  #loading .bird { font-size:64px; animation: bob 1.4s ease-in-out infinite; filter: drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
  #loading .bar { width:220px; height:4px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden; }
  #loading .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  #loading p { margin:0; font-size:13px; color:var(--dim); letter-spacing:.08em; }
  #loading .err { color:#ff8a8a; max-width:520px; text-align:center; line-height:1.6; }
  @keyframes bob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }

  @media (max-width:720px) {
    #help { display:none; }
    #stats .big { font-size:26px; }
    .lil-gui.root { top: 80px !important; right: 12px !important; max-height:60vh; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="bird">🦤</div>
  <div class="bar"><i id="loadbar"></i></div>
  <p id="loadtext">正在生成鹈鹕与自行车…</p>
</div>

<div id="title" class="hud">
  <h1>PELICAN <span>RIDES</span></h1>
  <p>鹈鹕骑行 · 沿海公路 · 实时程序化 3D</p>
</div>

<div id="stats" class="hud">
  <div class="big"><span id="spd">0</span><small>km/h</small></div>
  <div class="row"><span>里程 <b id="dist">0 m</b></span><span>时间 <b id="clock">08:00</b></span><span>FPS <b id="fps">–</b></span></div>
</div>

<div id="help" class="hud">
  <div><kbd>↑</kbd><kbd>↓</kbd> 加速 / 减速 &nbsp; <kbd>←</kbd><kbd>→</kbd> 变道</div>
  <div><kbd>Space</kbd> 跳跃扇翅 &nbsp; <kbd>B</kbd> 按铃 &nbsp; <kbd>C</kbd> 切换镜头 &nbsp; <kbd>N</kbd> 昼夜快进</div>
  <div><kbd>M</kbd> 海浪环境音 &nbsp; <kbd>P</kbd> 截图 &nbsp; 鼠标拖动 · 滚轮缩放（自由镜头）</div>
</div>

<div id="toast" class="hud"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

/* ------------------------------------------------------------------ */
/*  Bootstrap                                                          */
/* ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const setLoad = (p, t) => { $('loadbar').style.width = (p * 100) + '%'; if (t) $('loadtext').textContent = t; };
const toast = (() => { let h; return (msg) => { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(h); h = setTimeout(() => el.classList.remove('show'), 1800); }; })();

function fail(msg) {
  $('loading').innerHTML = `<div class="bird">🫠</div><p class="err">${msg}</p>`;
}

const canvasTest = document.createElement('canvas');
if (!(canvasTest.getContext('webgl2') || canvasTest.getContext('webgl'))) {
  fail('当前浏览器不支持 WebGL，无法渲染 3D 场景。'); throw new Error('no webgl');
}

setLoad(0.08, '初始化渲染器…');

/* ------------------------------------------------------------------ */
/*  Renderer / Scene / Camera                                          */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 600);
camera.position.set(-6, 3.2, 7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 2.5; controls.maxDistance = 40;
controls.target.set(0, 1.6, 0);
controls.enabled = false;

/* ------------------------------------------------------------------ */
/*  Parameters (GUI-bound)                                             */
/* ------------------------------------------------------------------ */
const Q = new URLSearchParams(location.search);
const qNum = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const P = {
  speed: qNum('speed', 6.5),           // m/s
  targetSpeed: qNum('speed', 6.5),
  timeOfDay: qNum('t', 8.2),       // hours
  autoDay: Q.get('day') !== '0',
  dayLength: 120,       // seconds per 24h
  camera: ['follow','side','front','cockpit','drone','orbit'].includes(Q.get('cam')) ? Q.get('cam') : 'follow',
  bloom: Q.get('bloom') !== '0',
  wireframe: false,
  feathers: true,
  scarf: true,
  fov: 48,
};

/* ------------------------------------------------------------------ */
/*  Utilities                                                          */
/* ------------------------------------------------------------------ */
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const materials = [];
function mat(opts) { const m = new THREE.MeshStandardMaterial(opts); materials.push(m); return m; }
function tube(a, b, r, material, radial = 12) {
  const dir = b.clone().sub(a); const len = dir.length();
  const g = new THREE.CylinderGeometry(r, r, len, radial, 1, false);
  const m = new THREE.Mesh(g, material);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V3(0, 1, 0), dir.normalize());
  m.castShadow = true; return m;
}
function shadow(o) { o.traverse((c) => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; }

/* ------------------------------------------------------------------ */
/*  Sky (custom shader dome, sun/moon glow, stars, horizon haze)       */
/* ------------------------------------------------------------------ */
const skyUniforms = {
  uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() }, uBottom: { value: new THREE.Color() },
  uSunDir: { value: V3(0, 1, 0) }, uSunColor: { value: new THREE.Color() }, uMoonDir: { value: V3(0, -1, 0) },
  uNight: { value: 0 }, uTime: { value: 0 },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 uTop,uHorizon,uBottom,uSunDir,uSunColor,uMoonDir; uniform float uNight,uTime;
    float hash(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = h > 0.0 ? mix(uHorizon, uTop, pow(clamp(h,0.,1.), 0.55)) : mix(uHorizon, uBottom, pow(clamp(-h,0.,1.), 0.6));
      float sd = max(dot(d, uSunDir), 0.0);
      col += uSunColor * (pow(sd, 380.0) * 6.0 + pow(sd, 18.0) * 0.32 + pow(sd, 3.0) * 0.06 * (1.0 - uNight));
      float md = max(dot(d, uMoonDir), 0.0);
      col += vec3(0.85,0.9,1.0) * (smoothstep(0.9993,0.9997,md) * 1.4 + pow(md, 40.0) * 0.08) * uNight;
      if (h > 0.0) {
        vec3 g = floor(d * 260.0); float s = hash(g);
        float star = step(0.9965, s) * smoothstep(0.0, 0.25, h) * (0.6 + 0.4 * sin(uTime * 2.0 + s * 60.0));
        col += vec3(star) * uNight * 0.9;
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(380, 48, 24), skyMat);
scene.add(sky);

/* ------------------------------------------------------------------ */
/*  Lights                                                             */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x6b5a3e, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18; sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);
const moonLight = new THREE.DirectionalLight(0x8fb0ff, 0); scene.add(moonLight);

const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe9b0 }));
const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(4.5, 24, 16), new THREE.MeshBasicMaterial({ color: 0xdfe9ff }));
scene.add(sunDisc, moonDisc);

scene.fog = new THREE.Fog(0xcfe6f5, 40, 220);

/* ------------------------------------------------------------------ */
/*  Ground: road, shoulders, sand, dunes                               */
/* ------------------------------------------------------------------ */
const WORLD_LEN = 240;
function roadTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#3a3d42'; g.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${rnd(120, 190)|0},${rnd(120, 190)|0},${rnd(125, 195)|0},${rnd(0.03, 0.12)})`; g.fillRect(Math.random() * 512, Math.random() * 256, 2, 2); }
  g.fillStyle = '#e8e2c8'; g.fillRect(0, 122, 300, 12);          // dashed center (repeat along x)
  g.fillStyle = '#f2f2f2'; g.fillRect(0, 10, 512, 8); g.fillRect(0, 238, 512, 8); // edge lines
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  t.repeat.set(WORLD_LEN / 6, 1); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noiseTexture(base, spot, n = 5000, sz = 256) {
  const c = document.createElement('canvas'); c.width = c.height = sz; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, sz, sz);
  for (let i = 0; i < n; i++) { g.fillStyle = spot; g.globalAlpha = rnd(0.05, 0.25); g.fillRect(Math.random() * sz, Math.random() * sz, rnd(1, 4), rnd(1, 4)); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const roadTex = roadTexture();
const road = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_LEN, 6), mat({ map: roadTex, roughness: 0.95, metalness: 0 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.01; road.receiveShadow = true; scene.add(road);

const sandTex = noiseTexture('#d9c7a0', '#b89e6c', 8000); sandTex.repeat.set(60, 12);
const sand = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_LEN, 60), mat({ map: sandTex, roughness: 1 }));
sand.rotation.x = -Math.PI / 2; sand.position.set(0, 0, 33); sand.receiveShadow = true; scene.add(sand);
const shoulder = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_LEN, 3.5), mat({ map: sandTex.clone(), roughness: 1 }));
shoulder.material.map.repeat.set(60, 1); shoulder.rotation.x = -Math.PI / 2; shoulder.position.set(0, 0, -4.7); shoulder.receiveShadow = true; scene.add(shoulder);

// Dunes: displaced plane with vertex noise
{
  const g = new THREE.PlaneGeometry(WORLD_LEN, 50, 120, 25); const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i); const dist = (y + 25) / 50;
    const h = (Math.sin(x * 0.11) * 1.4 + Math.sin(x * 0.043 + 2) * 2.6 + Math.cos(y * 0.2 + x * 0.05) * 0.8 + 3) * smooth(clamp(dist * 1.6 - 0.15, 0, 1));
    pos.setZ(i, Math.max(0, h));
  }
  g.computeVertexNormals();
  const dunes = new THREE.Mesh(g, mat({ map: noiseTexture('#e0cfa8', '#c2a878', 6000), roughness: 1 }));
  dunes.material.map.repeat.set(30, 8);
  dunes.rotation.x = -Math.PI / 2; dunes.position.set(0, -0.05, 38); dunes.receiveShadow = true; scene.add(dunes);
}
// Seawall / kerb
{
  const kerb = new THREE.Mesh(new THREE.BoxGeometry(WORLD_LEN, 0.35, 0.5), mat({ color: 0xbfb9a8, roughness: 0.9 }));
  kerb.position.set(0, 0.17, -6.7); kerb.castShadow = kerb.receiveShadow = true; scene.add(kerb);
  const bollards = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.09, 0.11, 0.9, 10), mat({ color: 0xe8e8e8, roughness: 0.6 }), 60);
  const d = new THREE.Object3D();
  for (let i = 0; i < 60; i++) { d.position.set(-WORLD_LEN / 2 + i * (WORLD_LEN / 60), 0.6, -6.7); d.updateMatrix(); bollards.setMatrixAt(i, d.matrix); }
  bollards.castShadow = true; scene.add(bollards);
  const rope = tube(V3(-WORLD_LEN / 2, 1.0, -6.7), V3(WORLD_LEN / 2, 1.0, -6.7), 0.02, mat({ color: 0x664422 }), 6); scene.add(rope);
}

/* ------------------------------------------------------------------ */
/*  Ocean: animated Gerstner-ish vertex waves + fresnel/specular       */
/* ------------------------------------------------------------------ */
const oceanUniforms = {
  uTime: { value: 0 }, uSunDir: { value: V3(0, 1, 0) }, uSunColor: { value: new THREE.Color(1, 1, 1) },
  uDeep: { value: new THREE.Color(0x0e4f6e) }, uShallow: { value: new THREE.Color(0x2fa3b8) }, uSkyColor: { value: new THREE.Color(0xbfe3ff) },
  uNight: { value: 0 }, uFogColor: { value: new THREE.Color() }, uFogNear: { value: 40 }, uFogFar: { value: 220 },
};
const oceanMat = new THREE.ShaderMaterial({
  uniforms: oceanUniforms, transparent: false,
  vertexShader: `
    uniform float uTime; varying vec3 vWorld; varying vec3 vNormal; varying float vFoam;
    vec3 wave(vec3 p, vec2 dir, float amp, float len, float speed, out vec3 dn) {
      float k = 6.28318 / len; float f = k * (dot(dir, p.xz) - speed * uTime);
      dn = vec3(-dir.x * amp * k * cos(f), 1.0, -dir.y * amp * k * cos(f));
      return vec3(0.0, amp * sin(f), 0.0);
    }
    void main(){
      vec3 p = (modelMatrix * vec4(position,1.0)).xyz;
      vec3 n1,n2,n3; vec3 o = wave(p, normalize(vec2(1.0,0.3)), 0.12, 9.0, 1.4, n1) + wave(p, normalize(vec2(-0.6,1.0)), 0.07, 4.5, 1.1, n2) + wave(p, normalize(vec2(0.2,-1.0)), 0.035, 2.2, 1.9, n3);
      p += o; vNormal = normalize(n1 + n2 + n3 - vec3(0.0,2.0,0.0)); vWorld = p;
      vFoam = smoothstep(0.12, 0.2, o.y);
      gl_Position = projectionMatrix * viewMatrix * vec4(p,1.0);
    }`,
  fragmentShader: `
    uniform vec3 uSunDir,uSunColor,uDeep,uShallow,uSkyColor,uFogColor; uniform float uNight,uTime,uFogNear,uFogFar;
    varying vec3 vWorld; varying vec3 vNormal; varying float vFoam;
    void main(){
      vec3 n = normalize(vNormal); vec3 v = normalize(cameraPosition - vWorld);
      float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
      float shore = smoothstep(-2.0, -14.0, vWorld.z);   // deeper further from beach
      vec3 base = mix(uShallow, uDeep, shore);
      vec3 col = mix(base, uSkyColor, fres * 0.42);
      vec3 h = normalize(uSunDir + v); float spec = pow(max(dot(n, h), 0.0), 220.0) * 2.4 + pow(max(dot(n, h), 0.0), 24.0) * 0.12;
      col += uSunColor * spec * (1.0 - uNight * 0.6);
      col += vec3(0.85) * vFoam * 0.35 * (1.0 - uNight * 0.7);
      col *= mix(1.0, 0.18, uNight);
      float depth = length(cameraPosition - vWorld); float fogF = smoothstep(uFogNear, uFogFar, depth);
      col = mix(col, uFogColor, fogF);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const ocean = new THREE.Mesh(new THREE.PlaneGeometry(600, 300, 220, 110), oceanMat);
ocean.rotation.x = -Math.PI / 2; ocean.position.set(0, -0.12, -157); scene.add(ocean);
// beach strip between kerb and water
const beach = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_LEN + 200, 2.5), mat({ map: sandTex.clone(), roughness: 1 }));
beach.material.map.repeat.set(80, 1); beach.rotation.x = -Math.PI / 2; beach.position.set(0, -0.02, -8.2); beach.receiveShadow = true; scene.add(beach);

/* ------------------------------------------------------------------ */
/*  Scrolling scenery: palms, rocks, clouds, buoys, lighthouse         */
/* ------------------------------------------------------------------ */
const scenery = []; // {obj, wrap: true}
function makePalm() {
  const g = new THREE.Group(); const trunkMat = mat({ color: 0x8b6a45, roughness: 0.95 });
  let p = V3(0, 0, 0); const lean = V3(rnd(-0.25, 0.25), 0, rnd(-0.25, 0.25));
  const h = rnd(3.5, 6);
  for (let i = 0; i < 6; i++) { const q = p.clone().add(V3(lean.x, h / 6, lean.z)); g.add(tube(p, q, 0.13 - i * 0.012, trunkMat, 8)); p = q; }
  const leafMat = mat({ color: 0x2f8a3a, roughness: 0.8, side: THREE.DoubleSide });
  const leafGeo = new THREE.PlaneGeometry(0.5, 2.6, 1, 6);
  { const pos = leafGeo.attributes.position; for (let i = 0; i < pos.count; i++) { const y = pos.getY(i); pos.setZ(i, -Math.pow((y + 1.3) / 2.6, 2) * 1.2); pos.setX(i, pos.getX(i) * (1 - Math.abs(y) / 1.6)); } leafGeo.computeVertexNormals(); }
  const n = 9;

  for (const o of scenery) { o.position.x -= dx; if (o.position.x < -WORLD_LEN / 2) { o.position.x += WORLD_LEN; if (o.userData.leaves) o.position.z = rnd(5.5, 14); } }
  for (const c of clouds) { c.position.x -= (dx * 0.25 + c.userData.speed * dt); if (c.position.x < -170) c.position.x += 340; }
  for (const b of buoys) { b.position.y = Math.sin(t * 1.3 + b.position.x) * 0.12; b.rotation.z = Math.sin(t * 0.9 + b.position.z) * 0.1; }
  for (const palm of scenery) if (palm.userData.leaves) for (const l of palm.userData.leaves) l.rotation.z = Math.sin(t * 1.8 + l.userData.phase) * 0.05;
  lighthouse.position.x -= dx * 0.15; if (lighthouse.position.x < -200) lighthouse.position.x += 400;
  lighthouse.userData.beamPivot.rotation.y = t * 0.6;

  // --- fish
  for (const f of fishes) {
    f.next -= dt;
    if (f.t < 1.6) { f.t += dt; const u = f.t / 1.6; f.obj.position.set(f.x0 + f.dir * u * 3, Math.sin(u * Math.PI) * 1.6 - 0.1, f.z0); f.obj.rotation.z = (0.5 - u) * Math.PI * 0.8 * f.dir; f.obj.rotation.y = f.dir > 0 ? 0 : Math.PI; f.obj.visible = true; if (u > 0.98) { spawnRing(f.obj.position.x, f.z0); f.obj.visible = false; } }
    else if (f.next <= 0) { f.t = 0; f.x0 = rnd(-30, 30); f.z0 = rnd(-30, -12); f.dir = Math.random() < 0.5 ? 1 : -1; f.next = rnd(3, 10); spawnRing(f.x0, f.z0); }
    if (f.obj.visible) f.obj.position.x -= dx * 0.3;
  }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; const s = 1 + r.t * 3; r.m.scale.set(s, s, s); r.m.material.opacity = 0.6 * (1 - r.t / 1.4); r.m.position.x -= dx * 0.3; if (r.t > 1.4) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); rings.splice(i, 1); } }

  // --- feathers
  for (let i = feathers.length - 1; i >= 0; i--) {
    const f = feathers[i]; f.life -= dt; if (f.life <= 0 || f.p.y < 0) { feathers.splice(i, 1); continue; }
    f.v.y -= 2.2 * dt; f.v.multiplyScalar(1 - 1.8 * dt); f.v.x -= P.speed * 0.4 * dt; f.p.addScaledVector(f.v, dt); f.p.x += Math.sin(t * 5 + f.phase) * 0.6 * dt; f.r.addScaledVector(f.w, dt);
  }
  feathers.forEach((f, i) => { tmpO.position.copy(f.p); tmpO.rotation.set(f.r.x, f.r.y, f.r.z); const s = clamp(f.life, 0, 1); tmpO.scale.set(s, s, s); tmpO.updateMatrix(); featherMesh.setMatrixAt(i, tmpO.matrix); });
  featherMesh.count = feathers.length; featherMesh.instanceMatrix.needsUpdate = true;

  // --- day / night
  if (P.autoDay) P.timeOfDay = (P.timeOfDay + dt * 24 / P.dayLength) % 24;
  const h = P.timeOfDay; const pal = palette(h);
  const sunA = ((h - 6) / 12) * Math.PI; // 6h → rise, 18h → set
  const sunDir = V3(Math.cos(sunA) * 0.6, Math.sin(sunA), -Math.cos(sunA) * 0.7 - 0.35).normalize();
  const night = clamp(1 - (sunDir.y + 0.1) * 4, 0, 1);
  sun.position.copy(sunDir).multiplyScalar(40); sun.target.position.set(0, 0, 0); sun.intensity = pal.sunI; sun.color.copy(pal.sunColor);
  const moonDir = sunDir.clone().negate(); moonDir.y = Math.abs(moonDir.y) * 0.8 + 0.2; moonDir.normalize();
  moonLight.position.copy(moonDir).multiplyScalar(40); moonLight.intensity = night * 0.45;
  hemi.intensity = pal.hemiI; hemi.color.copy(pal.horizon); hemi.groundColor.setHex(0x6b5a3e).lerp(new THREE.Color(0x101828), night);
  sunDisc.position.copy(sunDir).multiplyScalar(340).add(camera.position); sunDisc.visible = sunDir.y > -0.08; sunDisc.material.color.copy(pal.sunColor).multiplyScalar(2.5);
  moonDisc.position.copy(moonDir).multiplyScalar(340).add(camera.position); moonDisc.visible = night > 0.05; moonDisc.material.color.setRGB(1.2, 1.25, 1.4).multiplyScalar(night);
  sky.position.copy(camera.position);
  skyUniforms.uTop.value.copy(pal.top); skyUniforms.uHorizon.value.copy(pal.horizon); skyUniforms.uBottom.value.copy(pal.bottom); skyUniforms.uSunDir.value.copy(sunDir); skyUniforms.uMoonDir.value.copy(moonDir); skyUniforms.uSunColor.value.copy(pal.sunColor); skyUniforms.uNight.value = night; skyUniforms.uTime.value = t;
  scene.fog.color.copy(pal.fog);
  oceanUniforms.uTime.value = t; oceanUniforms.uSunDir.value.copy(sunDir.y > 0 ? sunDir : moonDir); oceanUniforms.uSunColor.value.copy(pal.sunColor); oceanUniforms.uSkyColor.value.copy(pal.horizon); oceanUniforms.uNight.value = night; oceanUniforms.uFogColor.value.copy(pal.fog);
  renderer.toneMappingExposure = pal.exposure;
  const lampsOn = smooth(clamp(night * 1.6, 0, 1));
  headLight.intensity = lampsOn * 60; lampLens.material.color.setRGB(1, 0.95, 0.8).multiplyScalar(0.6 + lampsOn * 3);
  tailLight.material.color.setRGB(1, 0.15, 0.15).multiplyScalar(0.6 + lampsOn * 3 + (Math.sin(t * 8) > 0 ? lampsOn : 0));
  lighthouse.userData.bulb.material.color.setRGB(1, 0.94, 0.75).multiplyScalar(0.5 + lampsOn * 4);
  lighthouse.userData.beamMat.opacity = lampsOn * 0.16;
  for (const b of buoys) b.userData.lamp.material.color.setRGB(1, 0.2, 0.1).multiplyScalar(0.5 + lampsOn * 3 * (Math.sin(t * 2 + b.position.x) > 0.3 ? 1 : 0.2));
  bloom.enabled = P.bloom; bloom.strength = 0.45 + night * 0.5;

  // --- audio follow
  if (actx && humGain) { humGain.gain.setTargetAtTime(wavesOn ? clamp(P.speed / 16, 0, 1) * 0.06 : 0, actx.currentTime, 0.2); humOsc.frequency.setTargetAtTime(30 + P.speed * 4, actx.currentTime, 0.2); }

  // --- camera
  camera.fov += (P.fov - camera.fov) * 0.1; camera.updateProjectionMatrix();
  updateCamera(dt);

  // --- HUD
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { $('fps').textContent = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  $('spd').textContent = (P.speed * 3.6).toFixed(0); $('dist').textContent = distance < 1000 ? `${distance.toFixed(0)} m` : `${(distance / 1000).toFixed(2)} km`; $('clock').textContent = fmtClock(h);

  composer.render();
}
function spawnRingDust() { spawnFeathers(rig.position.clone().add(V3(0, 0.3, 0)), 6); }

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
});

// first frame + reveal
camIdx = CAMS.indexOf(P.camera); controls.enabled = P.camera === 'orbit';
setLoad(1, '就位！');
renderer.compile(scene, camera);
animate();
setTimeout(() => { $('loading').classList.add('gone'); toast('🦤 鹈鹕出发！按 C 切换镜头，Space 起跳'); }, 500);
</script>
</body>
